site_name: EnvStencil
repo_url: https://github.com/kylefelipe/env-stencil
repo_name: kylefelipe/env-stencil
edit_uri: edit/main/docs

theme:
  name: material
  language: pt-BR
  logo: assets/envstencil-symbol-1024.png
  favicon: assets/envstencil-symbol-1024.png
  features:
    - navigation.indexes
  palette:
    # Escuro por padrão (base da marca: #101722)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mudar para o modo claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mudar para o modo escuro

nav:
  - Início: index.md
  - Modo de uso (CLI): cli_usage.md
  - Contribuindo: contributing.md
  - Referência da API:
    - api/index.md
    - API Core: api/core.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - mkdocs-click

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
  - macros:
      include_dir: docs/templates

extra:
  commands:
    run: envstencil
