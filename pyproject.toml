[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envstencil"
version = "0.1.0"
description = "Generate a safe .env.example stencil from your .env files"
readme = "README.md"
requires-python = ">=3.10, <4"
license = { text = "MIT" }
authors = [
    { name = "Kyle Felipe", email = "kylefelipe@gmail.com" }
]
keywords = ["dotenv", "env", "environment", "template", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[project.scripts]
envstencil = "envstencil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^7.1.0"
blue = "^0.9.1"
isort = "^9.0.1"
taskipy = "^1.14.1"

[tool.poetry.group.doc.dependencies]
mkdocs-material = "^9.7.7"
mkdocstrings = "^1.0.6"
mkdocstrings-python = "^2.0.7"
