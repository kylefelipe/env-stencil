[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "envstencil"
version = "0.1.0"
description = "Generate a safe .env.example stencil from your .env files"
readme = "README.md"
requires-python = ">=3.10,<4"
license = { text = "MIT" }
authors = [
    { name = "Kyle Felipe", email = "kylefelipe@gmail.com" }
]
keywords = ["dotenv", "env", "environment", "template", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/kylefelipe/env-stencil"
Documentation = "https://env-stencil.readthedocs.io/pt/latest/"
Repository = "https://github.com/kylefelipe/env-stencil"
Issues = "https://github.com/kylefelipe/env-stencil/issues"

[project.scripts]
envstencil = "envstencil.cli:main"

[tool.poetry]
packages = [{ include = "envstencil", from = "src" }]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^7.1.0"
isort = "^9.0.1"
taskipy = "^1.14.1"
black = "^26.5.1"

[tool.poetry.group.doc]
optional = true

[tool.poetry.group.doc.dependencies]
mkdocs-material = "^9.7.7"
mkdocstrings = "^1.0.6"
mkdocstrings-python = "^2.0.7"
mkdocs-click = "^0.9.0"
mkdocs-macros-plugin = "^1.5.0"
jinja2 = "^3.1.6"

[tool.isort]
profile = "black"
line_length = 79

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--doctest-modules"

[tool.taskipy.tasks]
pre_test = "task lint"
test = "pytest -s -x --cov=envstencil -vv"
post_test = "coverage html"
lint = "black --check --diff . && isort --check --diff ."
fmt = "isort . && black ."
docs = "mkdocs serve"
