# Configuração do Read the Docs
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      # O projeto usa Poetry
      - pip install poetry
      # Instala no virtualenv que o Read the Docs já criou e ativou
      - poetry config virtualenvs.create false
    post_install:
      # O grupo "doc" é optional no pyproject.toml -> precisa do --with
      - poetry install --with doc

mkdocs:
  configuration: mkdocs.yml
  # Equivalente a `mkdocs build --strict`
  fail_on_warning: true
