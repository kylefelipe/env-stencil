# Configuração do Read the Docs
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    # O projeto usa Poetry; instala no ambiente que o RTD criou/ativou
    - pip install poetry
    - poetry config virtualenvs.create false
    # O grupo "doc" é optional no pyproject.toml -> precisa do --with
    - poetry install --with doc
    # Build do MkDocs para o diretório que o RTD publica ('--strict' obrigatório)
    - mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html
